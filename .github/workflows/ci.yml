name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: sitewatch_test
          POSTGRES_PASSWORD: test-only-not-production
          POSTGRES_DB: sitewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitewatch_test -d sitewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sitewatch_test:test-only-not-production@localhost:5432/sitewatch_test
      TEST_DATABASE_URL: postgresql://sitewatch_test:test-only-not-production@localhost:5432/sitewatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
